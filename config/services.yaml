# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.home_latitude: '%env(float:HOME_LATITUDE)%'
    app.home_longitude: '%env(float:HOME_LONGITUDE)%'
    app.phone_backdoor_url: '%env(PHONE_BACKDOOR_URL)%'
    app.consolidation_live_deletes: '%env(bool:CONSOLIDATION_LIVE_DELETES)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Backdoor\SnapshotClient:
        arguments:
            $baseUrl: '%app.phone_backdoor_url%'

    App\Scheduler\PollBackdoorMessageHandler:
        arguments:
            $stateFile: '%kernel.project_dir%/var/breath_state.json'
            $logFile: '%kernel.project_dir%/var/log/breath.log'

    App\MCP\Tools\CurrentStateTool:
        public: true
        arguments:
            $stateFile: '%kernel.project_dir%/var/breath_state.json'

    App\Scheduler\ConsolidateMessageHandler:
        arguments:
            $liveDeletes: '%app.consolidation_live_deletes%'
            $stateFile: '%kernel.project_dir%/var/consolidation_state.json'
            $logFile: '%kernel.project_dir%/var/log/consolidation.log'

    # Steps needs the opposite priority from DataOriginPriority's default
    # (Health Connect first, still correct for HeartRate/OxygenSaturation
    # via OverlapResolver) — confirmed 29.08.2026 against the phone's own
    # Health Connect app, day by day, that Samsung Health (fed by the band)
    # is the right source for Steps and the phone's own on-device sensor
    # (com.android.healthconnect.phone.*) is the redundant one to drop. See
    # DataOriginPriority's docblock.
    App\Service\Consolidation\DailyStepsConsolidator:
        arguments:
            $priority: !service
                class: App\Service\Consolidation\DataOriginPriority
                arguments:
                    $priorities: { 'com.sec.android.app.shealth': 10 }

    # MCP tools are resolved by class name at runtime (KLP\KlpMcpServer\Services\ToolService\ToolRepository),
    # not wired in via a constructor Reference — mark them public so the container doesn't optimize them away.
    App\MCP\Tools\DailyVitalsSummaryTool:
        public: true

    App\MCP\Tools\LocationContextTool:
        public: true
        arguments:
            $homeLatitude: '%app.home_latitude%'
            $homeLongitude: '%app.home_longitude%'

    App\MCP\Tools\GetLastLocationTool:
        public: true

    App\MCP\Tools\GetLastHeartRateTool:
        public: true

    App\MCP\Tools\GetLastDayStepsTool:
        public: true

    App\MCP\Tools\GetLastNightSleepTool:
        public: true

    App\MCP\Tools\GetCurrentPlaceTool:
        public: true
